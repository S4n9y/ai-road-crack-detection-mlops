# Port map (no conflicts):
#   Prometheus    9090 -> 9090
#   Alertmanager  9093 -> 9093
#   Grafana       3001 -> 3000
#   Marquez API   5000 -> 5000  (OpenLineage HTTP target)
#   Marquez UI    3002 -> 3000
#   PostgreSQL    internal only

services:
  alertmanager:
    image: prom/alertmanager:latest
    container_name: road-crack-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: road-crack-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: road-crack-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "change-this-local-password"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: road-crack-marquez-postgres
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  marquez-api:
    image: marquezproject/marquez:0.51.1
    container_name: road-crack-marquez-api
    command: ["./entrypoint.sh", "api"]
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_HOST: 0.0.0.0
      MARQUEZ_CONFIG: /usr/src/app/marquez.dev.yml
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "5000:5000"
    volumes:
      - marquez_data:/usr/src/app/.marquez
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://localhost:5000/api/v1/namespaces/default/datasets?limit=1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  marquez-ui:
    image: marquezproject/marquez-web:latest
    container_name: road-crack-marquez-ui
    environment:
      # API base the browser reaches (host-mapped port 5000).
      MARQUEZ_HOST: http://localhost:5000
      MARQUEZ_PORT: 5000
      # Internal API address the UI container talks to.
      WEBSOCKET_URL: ws://marquez-api:5000
      WEB_PORT: 3000
    ports:
      - "3002:3000"
    depends_on:
      - marquez-api
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  marquez_data:
  marquez_postgres_data:
